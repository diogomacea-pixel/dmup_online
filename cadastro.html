<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro — Dashboard Streamers</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="tela-auth">

  <div class="auth-card">
    <div class="auth-logo">
      <img id="logoImg" src="assets/logo.png" alt="Logo" onerror="this.style.display='none'"/>
      <h1>Criar <span>Conta</span></h1>
    </div>

    <form id="formCadastro">
      <div class="campo">
        <label>Seu nome completo</label>
        <input type="text" id="nome" placeholder="Ex: João Silva" required/>
      </div>
      <div class="campo">
        <label>Usuário do TikTok</label>
        <input type="text" id="tiktok_usuario" placeholder="@seunome" required/>
        <small>Exatamente como aparece no TikTok</small>
      </div>
      <div class="campo">
        <label>ID do TikTok <span class="opcional">(opcional)</span></label>
        <input type="text" id="tiktok_userid" placeholder="Número do seu User ID"/>
        <small>
          Como encontrar: <a href="https://www.tiktok.com/@seunome" target="_blank">
          perfil → compartilhar → copiar link</a>
        </small>
      </div>
      <div class="campo">
        <label>WhatsApp (com DDD)</label>
        <input type="tel" id="telefone" placeholder="(11) 99999-9999" required/>
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6"/>
      </div>
      <div class="campo">
        <label>Confirmar senha</label>
        <input type="password" id="senha2" placeholder="Repita a senha" required/>
      </div>
      <button type="submit" class="btn-primary">Criar conta</button>
      <p class="link-secundario">
        Já tem conta? <a href="index.html">Entrar</a>
      </p>
    </form>

    <div id="msgErro"    class="msg-erro    oculto"></div>
    <div id="msgSucesso" class="msg-sucesso oculto"></div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Máscara de telefone
    document.getElementById('telefone').addEventListener('input', function () {
      let v = this.value.replace(/\D/g,'');
      if (v.length <= 11)
        this.value = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
    });

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const senha  = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;
      if (senha !== senha2) return mostrarErro('As senhas não coincidem.');

      const payload = {
        nome:           document.getElementById('nome').value,
        tiktok_usuario: document.getElementById('tiktok_usuario').value.replace('@',''),
        tiktok_userid:  document.getElementById('tiktok_userid').value,
        telefone:       document.getElementById('telefone').value,
        senha
      };

      mostrarCarregando(true);
      const res = await api('cadastrar', payload);
      mostrarCarregando(false);

      if (res.status === 'ok') {
        document.getElementById('msgSucesso').classList.remove('oculto');
        document.getElementById('msgSucesso').textContent =
          'Cadastro realizado! Redirecionando...';
        setTimeout(() => window.location.href = 'index.html', 2000);
      } else {
        mostrarErro(res.mensagem);
      }
    });

    carregarConfig();
  </script>
</body>
</html>
